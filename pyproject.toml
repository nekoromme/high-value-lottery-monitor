[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-value-lottery-monitor"
version = "0.1.0"
description = "高額商材の抽選販売を監視するGitHub Actions向けモニター"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "responses>=0.25,<1",
]

[project.scripts]
lottery-monitor = "high_value_lottery_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

