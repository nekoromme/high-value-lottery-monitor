name: RICOH regression tests

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml']

# テストには通知先などのSecretも、リポジトリへの書込み権限も渡さない。
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest
