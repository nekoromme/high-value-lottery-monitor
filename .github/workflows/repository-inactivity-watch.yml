name: Repository inactivity watch

on:
  schedule:
    # 毎日 日本時間 09:37（UTC 00:37）。正時付近の混雑を避ける。
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 公開リポジトリの最終更新を確認して50日以上ならDiscord通知
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OWNER: ${{ github.repository_owner }}
        run: |
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()

          if not webhook:
              print("DISCORD_WEBHOOK_URL が未設定なので通知できません", file=sys.stderr)
              sys.exit(1)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "repository-inactivity-watch",
          }

          repos = []
          page = 1
          while True:
              url = f"https://api.github.com/users/{owner}/repos?type=owner&sort=full_name&per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  batch = json.load(response)
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          now = datetime.now(timezone.utc)
          warnings = []

          for repo in repos:
              if repo.get("archived") or repo.get("fork") or repo.get("private"):
                  continue

              pushed_at = repo.get("pushed_at")
              if not pushed_at:
                  continue

              last_push = datetime.fromisoformat(pushed_at.replace("Z", "+00:00"))
              days = (now - last_push).days
              print(f"{repo['full_name']}: 最終push {days}日前 ({pushed_at})")

              if days >= 50:
                  warnings.append((days, repo["full_name"], repo["html_url"]))

          if not warnings:
              print("50日以上pushのない公開リポジトリはありません")
              sys.exit(0)

          warnings.sort(reverse=True)
          lines = [
              "⚠️ GitHub Actions 60日無活動停止の事前警告",
              "",
              "次の公開リポジトリは最終pushから50日以上経過しています。",
              "GitHubのscheduled workflowが60日無活動で無効化される前に確認してください。",
              "",
          ]
          for days, name, url in warnings:
              lines.append(f"• {name}: {days}日前\n  {url}")

          payload = json.dumps({"content": "\n".join(lines)}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "repository-inactivity-watch"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print(f"Discord通知: HTTP {response.status}")
