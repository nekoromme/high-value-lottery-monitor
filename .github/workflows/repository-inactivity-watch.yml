name: Repository inactivity fallback

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 55日以上無活動の公開リポジトリをDiscord警告
        shell: python
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OWNER: ${{ github.repository_owner }}
        run: |
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          owner = os.environ["OWNER"]
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          now = datetime.now(timezone.utc)

          repos = []
          page = 1
          while True:
              url = f"https://api.github.com/users/{owner}/repos?type=owner&sort=full_name&per_page=100&page={page}"
              req = urllib.request.Request(url, headers={"User-Agent": "repository-inactivity-fallback"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  batch = json.load(response)
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          warnings = []
          for repo in repos:
              if repo.get("archived") or repo.get("fork") or repo.get("private"):
                  continue
              pushed_at = repo.get("pushed_at")
              if not pushed_at:
                  continue
              last_push = datetime.fromisoformat(pushed_at.replace("Z", "+00:00"))
              days = (now - last_push).days
              print(f"{repo['full_name']}: 最終push {days}日前")
              if days >= 55:
                  warnings.append((days, repo["full_name"], repo["html_url"]))

          if not warnings:
              print("55日以上無活動の公開リポジトリはありません")
              raise SystemExit(0)

          lines = [
              "🚨 GitHub無活動ガード: 55日以上無活動のリポジトリがあります。",
              "50日目の自動keep-aliveが効いていない可能性があります。60日停止前に確認してください。",
              "",
          ]
          for days, name, url in sorted(warnings, reverse=True):
              lines.append(f"• {name}: {days}日前\n  {url}")

          text = "\n".join(lines)
          print(text)
          if webhook:
              payload = json.dumps({"content": text}, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={"Content-Type": "application/json", "User-Agent": "repository-inactivity-fallback"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  print(f"Discord通知: HTTP {response.status}")
